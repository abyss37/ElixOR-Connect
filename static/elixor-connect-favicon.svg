<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" style="font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Металлическое кольцо Halo (Градиент отражений) -->
    <linearGradient id="halo-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80F0FF" />
      <stop offset="30%" stop-color="#2D486B" />
      <stop offset="70%" stop-color="#4A2E1B" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>

    <!-- Сапфировые кристаллические крылья -->
    <linearGradient id="sapphire-crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70E5FF" />
      <stop offset="35%" stop-color="#0066FF" />
      <stop offset="75%" stop-color="#001A66" />
      <stop offset="100%" stop-color="#03081A" />
    </linearGradient>

    <!-- Огненный плазменный луч LeXX -->
    <linearGradient id="laser-fire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="20%" stop-color="#FFD700" />
      <stop offset="60%" stop-color="#FF5500" />
      <stop offset="100%" stop-color="#CC0000" />
    </linearGradient>

    <!-- Темный хром и карбон корпуса -->
    <linearGradient id="chrome-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Неоновое фоновое подсвечивание -->
    <radialGradient id="bg-glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#0055FF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FF5500" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="core-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="25%" stop-color="#FFD700" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FF5500" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#07090E" stop-opacity="0" />
    </radialGradient>

    <!-- Фильтры свечения -->
    <filter id="fire-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur1" />
      <feGaussianBlur stdDeviation="2.5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Скругленный контейнер App Icon -->
  <rect width="512" height="512" rx="112" fill="#07090E" />
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />
  <rect width="506" height="506" x="3" y="3" rx="110" fill="none" stroke="url(#sapphire-crystal)" stroke-width="2" stroke-opacity="0.3" />

  <!-- 1. МЕТАЛЛИЧЕСКОЕ КОЛЬЦО-ОРЕОЛ (HALO RING) -->
  <g filter="url(#neon-glow)">
    <circle cx="256" cy="215" r="145" fill="none" stroke="url(#halo-ring)" stroke-width="18" />
    <circle cx="256" cy="215" r="154" fill="none" stroke="#70E5FF" stroke-width="1.5" opacity="0.5" />
    <circle cx="256" cy="215" r="136" fill="none" stroke="#000000" stroke-width="2" opacity="0.6" />
  </g>

  <!-- 2. МОНОЛИТНЫЙ ОГНЕННЫЙ ЛАЗЕР -->
  <g filter="url(#fire-glow)">
    <!-- Апертурный ореол -->
    <circle cx="256" cy="215" r="32" fill="url(#core-flare)" />
    <!-- Плазменный шлейф -->
    <line x1="256" y1="215" x2="256" y2="455" stroke="url(#laser-fire)" stroke-width="12" stroke-linecap="round" opacity="0.45" />
    <!-- Сфокусированный луч -->
    <line x1="256" y1="215" x2="256" y2="455" stroke="url(#laser-fire)" stroke-width="5" stroke-linecap="round" />
    <!-- Раскаленная белая жила -->
    <line x1="256" y1="215" x2="256" y2="450" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 3. КРИСТАЛЛИЧЕСКИЕ САПФИРОВЫЕ КРЫЛЬЯ -->
  <g filter="url(#neon-glow)">
    <!-- ПРАВОЕ ВЕРХНЕЕ КРЫЛО -->
    <path d="M 256,200 C 310,135 410,105 450,110 C 420,150 350,195 256,210 Z" fill="url(#sapphire-crystal)" stroke="#70E5FF" stroke-width="1.8" />
    <path d="M 280,185 L 420,120 L 370,165 Z" fill="#70E5FF" opacity="0.3" />

    <!-- ПРАВОЕ НИЖНЕЕ КРЫЛО -->
    <path d="M 256,215 C 320,185 415,200 440,225 C 390,240 320,240 256,220 Z" fill="url(#sapphire-crystal)" stroke="#0066FF" stroke-width="1.5" />
    <path d="M 285,210 L 410,215 L 350,230 Z" fill="#70E5FF" opacity="0.25" />

    <!-- ЛЕВОЕ ВЕРХНЕЕ КРЫЛО -->
    <path d="M 256,200 C 202,135 102,105 62,110 C 92,150 162,195 256,210 Z" fill="url(#sapphire-crystal)" stroke="#70E5FF" stroke-width="1.8" />
    <path d="M 232,185 L 92,120 L 142,165 Z" fill="#70E5FF" opacity="0.3" />

    <!-- ЛЕВОЕ НИЖНЕЕ КРЫЛО -->
    <path d="M 256,215 C 192,185 97,200 72,225 C 122,240 192,240 256,220 Z" fill="url(#sapphire-crystal)" stroke="#0066FF" stroke-width="1.5" />
    <path d="M 227,210 L 102,215 L 162,230 Z" fill="#70E5FF" opacity="0.25" />
  </g>

  <!-- 4. КОРПУС И ГОЛОВА СТРЕКОЗЫ -->
  <g filter="url(#neon-glow)">
    <!-- Глазки -->
    <circle cx="244" cy="148" r="8" fill="url(#chrome-body)" stroke="#70E5FF" stroke-width="1" />
    <circle cx="268" cy="148" r="8" fill="url(#chrome-body)" stroke="#70E5FF" stroke-width="1" />
    <path d="M 246,140 C 252,136 260,136 266,140 C 272,148 240,148 246,140 Z" fill="#94A3B8" />

    <!-- Биомеханические направляющие (лапки) -->
    <path d="M 240,180 L 210,220 L 215,260" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 272,180 L 302,220 L 297,260" fill="none" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 242,200 L 225,235 L 228,275" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 270,200 L 287,235 L 284,275" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Броня груди и хвостовое сопло -->
    <path d="M 244,158 L 268,158 L 276,185 L 236,185 Z" fill="url(#chrome-body)" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 248,245 L 264,245 L 260,310 L 252,310 Z" fill="url(#chrome-body)" stroke="#FF5500" stroke-width="1.5" />
  </g>

  <!-- 5. ОКУЛЮС И ТРИСКЕЛЬ В ЯДРЕ -->
  <g filter="url(#fire-glow)">
    <!-- Сопло Окулюса -->
    <circle cx="256" cy="215" r="30" fill="#07090E" stroke="url(#laser-fire)" stroke-width="4" />
    <circle cx="256" cy="215" r="23" fill="none" stroke="#70E5FF" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.85" />

    <!-- Затвор Трискеля -->
    <g transform="translate(256, 215)">
      <path d="M 0,-4 L 10,-18 L 16,-12 L 6,-1 Z" fill="none" stroke="url(#laser-fire)" stroke-width="2" stroke-linejoin="round" />
      <g transform="rotate(120)">
        <path d="M 0,-4 L 10,-18 L 16,-12 L 6,-1 Z" fill="none" stroke="url(#laser-fire)" stroke-width="2" stroke-linejoin="round" />
      </g>
      <g transform="rotate(240)">
        <path d="M 0,-4 L 10,-18 L 16,-12 L 6,-1 Z" fill="none" stroke="url(#laser-fire)" stroke-width="2" stroke-linejoin="round" />
      </g>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- 6. НИЖНИЙ ТЕРМИНАЛ (CONNECT NODE) -->
  <g filter="url(#fire-glow)">
    <circle cx="256" cy="455" r="8" fill="#07090E" stroke="url(#laser-fire)" stroke-width="2.5" />
    <circle cx="256" cy="455" r="4" fill="#FF0055" />
    <circle cx="256" cy="455" r="1.5" fill="#FFFFFF" />
  </g>
</svg>
