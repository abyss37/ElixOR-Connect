name: ElixOR Connect Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elixor-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - linux
      - x64
      - elixor-production
    timeout-minutes: 20

    steps:
      - name: Run restricted production deployment
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo -n /usr/local/sbin/elixor-deploy
