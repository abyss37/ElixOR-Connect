<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script>
        (() => {
            try {
                const theme = localStorage.getItem("finflow-theme");
                if (theme === "light" || theme === "dark") {
                    document.documentElement.setAttribute("data-theme", theme);
                }
            } catch (e) {}
        })();
    </script>

    <title>ElixOR Connect — {{ error_code }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/finflow.css') }}?v=20261016-3"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow-x: hidden;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #e7f0fb;
            background:
                radial-gradient(
                    circle at 50% 18%,
                    rgba(37, 99, 235, .16),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 15% 85%,
                    rgba(34, 211, 238, .07),
                    transparent 28%
                ),
                #050c16;
        }

        html[data-theme="light"] {
            color-scheme: light;
        }

        html[data-theme="light"] body {
            color: var(--ff-text-primary);
            background:
                radial-gradient(
                    circle at 50% 18%,
                    rgba(37, 99, 235, .10),
                    transparent 34%
                ),
                radial-gradient(
                    circle at 15% 85%,
                    rgba(8, 145, 178, .06),
                    transparent 28%
                ),
                var(--ff-app-background);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(
                    120deg,
                    transparent 0%,
                    rgba(255,255,255,.018) 50%,
                    transparent 100%
                );
            opacity: .8;
        }

        .error-shell {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        .error-wrap {
            width: min(100%, 620px);
            text-align: center;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 28px;
            color: #dbeafe;
            text-decoration: none;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 11px;
            border: 1px solid rgba(96,165,250,.22);
            background:
                linear-gradient(
                    145deg,
                    rgba(59,130,246,.16),
                    rgba(34,211,238,.05)
                );
            box-shadow:
                0 12px 35px rgba(37,99,235,.12),
                inset 0 1px 0 rgba(255,255,255,.05);
        }

        .brand-mark i {
            font-size: 17px;
            color: #7dd3fc;
        }

        .brand-name {
            margin: 0;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -.02em;
        }

        .brand-name span {
            color: #60a5fa;
        }

        .card {
            position: relative;
            overflow: hidden;
            padding: 46px 42px 40px;
            border: 1px solid rgba(148,163,184,.13);
            border-radius: 26px;
            background:
                linear-gradient(
                    145deg,
                    rgba(15,30,48,.86),
                    rgba(7,17,30,.92)
                );
            box-shadow:
                0 32px 90px rgba(0,0,0,.38),
                0 0 70px rgba(37,99,235,.07),
                inset 0 1px 0 rgba(255,255,255,.045);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0 18% auto;
            height: 1px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(96,165,250,.75),
                    rgba(34,211,238,.35),
                    transparent
                );
        }

        .status-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 24px;
            display: grid;
            place-items: center;
            border-radius: 21px;
            border: 1px solid rgba(96,165,250,.18);
            background:
                linear-gradient(
                    145deg,
                    rgba(59,130,246,.13),
                    rgba(34,211,238,.045)
                );
            box-shadow:
                0 18px 45px rgba(37,99,235,.12),
                inset 0 1px 0 rgba(255,255,255,.04);
        }

        .status-icon i {
            font-size: 29px;
            color: #7dd3fc;
        }

        .error-code {
            margin: 0;
            font-size: clamp(72px, 15vw, 112px);
            line-height: .9;
            font-weight: 900;
            letter-spacing: -.065em;
            color: #edf6ff;
            text-shadow:
                0 0 50px rgba(96,165,250,.12);
        }

        .error-title {
            margin: 20px 0 0;
            font-size: clamp(22px, 4vw, 29px);
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -.025em;
            color: #eaf3ff;
        }

        .error-message {
            max-width: 480px;
            margin: 14px auto 0;
            color: #8fa4ba;
            font-size: 14px;
            line-height: 1.75;
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 32px;
        }

        .action {
            min-height: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 0 17px;
            border-radius: 12px;
            border: 1px solid transparent;
            text-decoration: none;
            font-size: 12px;
            font-weight: 800;
            transition:
                transform .18s ease,
                border-color .18s ease,
                background .18s ease,
                color .18s ease,
                box-shadow .18s ease;
        }

        .action:hover {
            transform: translateY(-1px);
        }

        .action-primary {
            color: #06101c;
            background:
                linear-gradient(
                    135deg,
                    #60a5fa,
                    #38bdf8
                );
            box-shadow:
                0 10px 30px rgba(37,99,235,.18);
        }

        .action-primary:hover {
            box-shadow:
                0 14px 35px rgba(37,99,235,.25);
        }

        .action-secondary {
            color: #9fb1c5;
            border-color: rgba(148,163,184,.13);
            background: rgba(8,18,31,.58);
        }

        .action-secondary:hover {
            color: #e5effa;
            border-color: rgba(148,163,184,.23);
            background: rgba(15,30,48,.72);
        }

        .security-note {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 28px;
            color: #60758c;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
        }

        .security-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 12px rgba(52,211,153,.45);
        }

        .footer {
            margin-top: 22px;
            color: #43566b;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        html[data-theme="light"] .brand {
            color: var(--ff-text-primary);
        }

        html[data-theme="light"] .brand-mark,
        html[data-theme="light"] .status-icon {
            border-color: var(--ff-border-control);
            background: var(--ff-surface-control);
            box-shadow: var(--ff-shadow-card);
        }

        html[data-theme="light"] .brand-mark i,
        html[data-theme="light"] .status-icon i {
            color: #2563eb;
        }

        html[data-theme="light"] .brand-name span {
            color: #2563eb;
        }

        html[data-theme="light"] .card {
            border-color: var(--ff-border-modal);
            background: var(--ff-surface-modal);
            box-shadow: var(--ff-shadow-modal);
        }

        html[data-theme="light"] .error-code,
        html[data-theme="light"] .error-title {
            color: var(--ff-text-primary);
            text-shadow: none;
        }

        html[data-theme="light"] .error-message {
            color: var(--ff-text-secondary);
        }

        html[data-theme="light"] .action-secondary {
            color: var(--ff-text-secondary);
            border-color: var(--ff-border-button);
            background: var(--ff-button-secondary-background);
        }

        html[data-theme="light"] .action-secondary:hover {
            color: var(--ff-text-primary);
            border-color: var(--ff-border-button-hover);
            background: var(--ff-button-secondary-hover);
        }

        html[data-theme="light"] .security-note {
            color: var(--ff-text-muted);
        }

        html[data-theme="light"] .footer {
            color: var(--ff-text-muted);
        }

        @media (max-width: 560px) {
            .error-shell {
                padding: 22px 14px;
            }

            .card {
                padding: 38px 22px 32px;
                border-radius: 22px;
            }

            .status-icon {
                width: 64px;
                height: 64px;
                margin-bottom: 20px;
            }

            .actions {
                flex-direction: column;
            }

            .action {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition: none !important;
            }
        }
    </style>
</head>

<body>

<main class="error-shell">
    <div class="error-wrap">

        <div class="brand" aria-label="ElixOR Connect">
            <span class="brand-mark">
                <i class="bi bi-grid-1x2-fill"></i>
            </span>

            <span class="brand-name">
                ElixOR <span>Connect</span>
            </span>
        </div>

        <section class="card" aria-labelledby="error-title">

            <div class="status-icon">
                <i class="bi bi-shield-lock"></i>
            </div>

            <p class="error-code">{{ error_code }}</p>

            <h1 id="error-title" class="error-title" data-error-title="{{ error_title }}">
                {{ error_title }}
            </h1>

            <p class="error-message" data-error-message="{{ error_message }}">
                {{ error_message }}
            </p>

            <div class="actions">

                <a
                    href="{{ url_for('index') }}"
                    class="action action-primary"
                >
                    <i class="bi bi-grid-1x2-fill"></i>
                    <span data-i18n-error="back">Повернутися до панелі</span>
                </a>

                <a
                    href="{{ url_for('logout') }}"
                    onclick="event.preventDefault(); document.getElementById('error-logout').submit();"
                    class="action action-secondary"
                >
                    <i class="bi bi-box-arrow-right"></i>
                    <span data-i18n-error="logout">Вийти</span>
                </a>

            </div>

            <div class="security-note">
                <span class="security-dot"></span>
                <span data-i18n-error="security">Безпечний доступ ElixOR Connect</span>
            </div>

        </section>

        <footer class="footer">
            <span data-i18n-error="footer">Система фінансового управління</span>
        </footer>

        <form
            id="error-logout"
            method="post"
            action="{{ url_for('logout') }}"
            hidden
        >
            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >
        </form>

    </div>
</main>


<script>
(function () {
    "use strict";

    const translations = {
        uk: {
            back: "Повернутися до панелі",
            logout: "Вийти",
            security: "Безпечний доступ ElixOR Connect",
            footer: "Система фінансового управління",

            "Security check failed":
                "Перевірку безпеки не пройдено",
            "CSRF validation failed. Please reload the page and try again.":
                "Не вдалося виконати перевірку CSRF. Перезавантажте сторінку та спробуйте ще раз.",

            "Page not found":
                "Сторінку не знайдено",
            "The page you requested could not be found. It may have been moved or the address may be incorrect.":
                "Сторінку, яку ви запитали, не знайдено. Можливо, її було переміщено або адреса неправильна.",

            "Access denied":
                "Доступ заборонено",
            "You do not have permission to access this resource.":
                "У вас немає дозволу на доступ до цього ресурсу.",
            "You do not have permission to access this page.":
                "У вас немає дозволу на доступ до цієї сторінки.",

            "Something went wrong":
                "Щось пішло не так",
            "ElixOR Connect encountered an unexpected server error. Please try again or return to the dashboard.":
                "У ElixOR Connect сталася неочікувана помилка сервера. Спробуйте ще раз або поверніться до панелі.",

            "Invalid company name":
                "Некоректна назва компанії",
            "Company name is required.":
                "Необхідно вказати назву компанії.",
            "Company name must be 255 characters or fewer.":
                "Назва компанії має містити не більше 255 символів.",
            "Invalid company status": "Некоректний статус компанії",
            "Unknown company status.": "Невідомий статус компанії.",
            "Company already exists": "Компанія вже існує",
            "An OurCompany with this name already exists.": "Організація з такою назвою вже існує.",
            "Could not create company": "Не вдалося створити компанію",
            "The company could not be created.": "Не вдалося створити компанію.",
            "Could not update company": "Не вдалося оновити компанію",
            "The company could not be updated.": "Не вдалося оновити компанію.",
            "Invalid username": "Некоректне ім'я користувача",
            "Username is required.": "Необхідно вказати ім'я користувача.",
            "Username must be 64 characters or fewer.": "Ім'я користувача має містити не більше 64 символів.",
            "Invalid password": "Некоректний пароль",
            "Invalid role": "Некоректна роль",
            "Unknown user role.": "Невідома роль користувача.",
            "User already exists": "Користувач уже існує",
            "A user with this username already exists.": "Користувач із таким ім'ям уже існує.",
            "Action not allowed": "Дію заборонено",
            "You cannot deactivate your own account.": "Не можна деактивувати власний обліковий запис.",
            "You cannot remove the administrator role from your own account.": "Не можна зняти роль адміністратора зі свого облікового запису.",
            "At least one active administrator must remain.": "Має залишитися щонайменше один активний адміністратор."
        },

        en: {
            back: "Back to Dashboard",
            logout: "Logout",
            security: "Secure ElixOR Connect access",
            footer: "Financial management system",
            "Security check failed": "Security check failed",
            "CSRF validation failed. Please reload the page and try again.": "CSRF validation failed. Please reload the page and try again.",
            "Page not found": "Page not found",
            "The page you requested could not be found. It may have been moved or the address may be incorrect.": "The page you requested could not be found. It may have been moved or the address may be incorrect.",
            "Access denied": "Access denied",
            "You do not have permission to access this resource.": "You do not have permission to access this resource.",
            "You do not have permission to access this page.": "You do not have permission to access this page.",
            "Something went wrong": "Something went wrong",
            "ElixOR Connect encountered an unexpected server error. Please try again or return to the dashboard.": "ElixOR Connect encountered an unexpected server error. Please try again or return to the dashboard.",
            "Invalid company name": "Invalid company name",
            "Company name is required.": "Company name is required.",
            "Company name must be 255 characters or fewer.": "Company name must be 255 characters or fewer.",
            "Invalid company status": "Invalid company status",
            "Unknown company status.": "Unknown company status.",
            "Company already exists": "Company already exists",
            "An OurCompany with this name already exists.": "An organization with this name already exists.",
            "Could not create company": "Could not create company",
            "The company could not be created.": "The company could not be created.",
            "Could not update company": "Could not update company",
            "The company could not be updated.": "The company could not be updated.",
            "Invalid username": "Invalid username",
            "Username is required.": "Username is required.",
            "Username must be 64 characters or fewer.": "Username must be 64 characters or fewer.",
            "Invalid password": "Invalid password",
            "Password must contain at least 8 characters.": "Password must contain at least 8 characters.",
            "Invalid role": "Invalid role",
            "Unknown user role.": "Unknown user role.",
            "User already exists": "User already exists",
            "A user with this username already exists.": "A user with this username already exists.",
            "Action not allowed": "Action not allowed",
            "You cannot deactivate your own account.": "You cannot deactivate your own account.",
            "You cannot remove the administrator role from your own account.": "You cannot remove the administrator role from your own account.",
            "At least one active administrator must remain.": "At least one active administrator must remain."
        }
    };

    function getLang() {
        try {
            return localStorage.getItem("finflow-language") === "en"
                ? "en"
                : "uk";
        } catch (error) {
            return "uk";
        }
    }

    function applyErrorLanguage() {
        const lang = getLang();
        const dict = translations[lang] || translations.uk;

        document.documentElement.lang = lang;

        document.querySelectorAll("[data-i18n-error]").forEach(function (el) {
            const key = el.getAttribute("data-i18n-error");
            if (dict[key]) {
                el.textContent = dict[key];
            }
        });

        const title = document.querySelector("[data-error-title]");
        if (title) {
            const value = title.getAttribute("data-error-title");
            if (dict[value]) {
                title.textContent = dict[value];
            }
        }

        const message = document.querySelector("[data-error-message]");
        if (message) {
            const value = message.getAttribute("data-error-message");
            if (dict[value]) {
                message.textContent = dict[value];
            }
        }

        document.title = "ElixOR Connect — " +
            (document.querySelector(".error-code")?.textContent || "");
    }

    applyErrorLanguage();
})();
</script>

</body>
</html>
